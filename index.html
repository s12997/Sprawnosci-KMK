<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<title>Sprawności</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1f2a22;--mu:#6b7569;--ac:#2f6b3a;--ac2:#e8f1e9;--bd:#e2ddd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a17;--card:#202622;--tx:#eef2ee;--mu:#9aa69b;--ac:#6fbf7d;--ac2:#27352a;--bd:#2f3832}}
:root[data-theme="dark"]{--bg:#161a17;--card:#202622;--tx:#eef2ee;--mu:#9aa69b;--ac:#6fbf7d;--ac2:#27352a;--bd:#2f3832}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding-bottom:96px}
header{padding:20px 16px 8px}
h1{margin:0;font-size:24px}
.sub{color:var(--mu);font-size:14px;margin-top:2px}
.bar{height:8px;background:var(--bd);border-radius:8px;margin:12px 0 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.tabs{display:flex;gap:8px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.tabs button{flex:1;padding:9px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:4px 16px}
.b{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;position:relative}
.ic{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:32px;border:3px solid var(--c)}
.b.off .ic{filter:grayscale(1);opacity:.4;border-style:dashed}
.b.off{opacity:.85}
.nm{font-weight:600;font-size:14px;word-break:break-word}
.st{font-size:12px;color:var(--mu);margin-top:3px}
.b:not(.off)::after{content:"✓";position:absolute;top:8px;right:10px;color:var(--ac);font-weight:700}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px 10px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:19px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input[type=text],textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 10px;border:1px solid var(--bd);border-radius:999px;background:var(--bg);color:var(--tx);font-size:13px}
.chip.on{background:var(--ac2);border-color:var(--ac)}
.cols{display:flex;gap:10px}
.col{width:30px;height:30px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.col.on{border-color:var(--tx)}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px;color:var(--tx)}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.d{color:#c0392b}
.big{text-align:center}
.big .ic{width:96px;height:96px;font-size:48px}
</style>
</head>
<body>
<header>
  <h1>🏕️ Moje sprawności</h1>
  <div class="sub" id="sum"></div>
  <div class="bar"><i id="pb"></i></div>
</header>
<div class="tabs" id="tabs">
  <button data-f="all" class="on">Wszystkie</button>
  <button data-f="got">Zdobyte</button>
  <button data-f="todo">Do zdobycia</button>
</div>
<div class="grid" id="grid"></div>
<button class="fab" id="fab" aria-label="Dodaj sprawność">+</button>

<div class="ov" id="ovAdd"><div class="sheet">
  <h2>Nowa sprawność</h2>
  <label>Z szablonu</label>
  <div class="chips" id="tpl"></div>
  <label for="fn">Nazwa</label>
  <input type="text" id="fn" maxlength="40" placeholder="np. Kucharz">
  <label for="fd">Opis (opcjonalnie)</label>
  <textarea id="fd" rows="2" maxlength="120" placeholder="Co trzeba zrobić?"></textarea>
  <label>Ikona</label>
  <div class="chips" id="icons"></div>
  <label>Kolor</label>
  <div class="cols" id="cols"></div>
  <label class="chk"><input type="checkbox" id="fg"> Przyznaj od razu</label>
  <div class="row"><button class="btn" id="cancel">Anuluj</button><button class="btn p" id="save">Dodaj</button></div>
</div></div>

<div class="ov" id="ovDet"><div class="sheet big" id="det"></div></div>

<script>
var TPL=[["Zielony kciuk","🪴","Utrzymaj roślinę przy życiu przez miesiąc"],["Siewca","🌱","Wysiej nasiona i doczekaj się kiełków"],["Ogrodnik","🌻","Wyhoduj kwiat od nasiona do kwitnienia"],["Zielarz","🌿","Wyhoduj własne zioła w doniczce"],["Mistrz formuł","🧮","Użyj SUMA, JEŻELI i WYSZUKAJ.PIONOWO"],["Tabela przestawna","📊","Zrób tabelę przestawną z własnych danych"],["Wykresy","📈","Stwórz czytelny wykres"],["Skrótowiec","⌨️","Naucz się 10 skrótów klawiszowych"],["Zrób super plan","🗺️","Przygotuj plan i zrealizuj go"],["Miej urodziny","🎂","Obchodź urodziny z klasą"]];
var ICONS=["🏅","🩹","🏊","🍳","🧭","🔥","🪢","🌿","🚴","📷","🔧","⛺","⭐","🎸","📚","🧩","🪴","🌱","🌻","🧮","📊","📈","⌨️","🗺️","🎂","🎉","🎁","🏆"];
var COLORS=["#2f6b3a","#2a6fb5","#c0662b","#a8323e","#7b4fa3","#b8962e"];
var KEY="sprawnosci_v1",items=[],filter="all",sel={icon:"🏅",color:COLORS[0]};
function load(){try{var r=localStorage.getItem(KEY);if(r)items=JSON.parse(r)}catch(e){}
   if(!items.length){items=[{id:1,name:"Zrób super plan",desc:"Przygotuj plan, który odpowiada 75% nauczycieli",icon:"🗺️",color:"#2a6fb5",got:true},{id:2,name:"Miej urodziny",desc:"Obchodź urodziny z klasą",icon:"🎂",color:"#b8962e",got:false}]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function today(){return new Date().toLocaleDateString("pl-PL")}
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function render(){
 var got=items.filter(function(i){return i.got}).length;
 $("sum").textContent="Zdobyte: "+got+" z "+items.length;
 $("pb").style.width=(items.length?got/items.length*100:0)+"%";
 var g=$("grid");g.innerHTML="";
 var list=items.filter(function(i){return filter=="all"||(filter=="got")==i.got});
 if(!list.length){g.appendChild(el("div","empty","Nic tu jeszcze nie ma. Dodaj sprawność przyciskiem +"))}
 list.forEach(function(i){
  var b=el("div","b"+(i.got?"":" off"));b.style.setProperty("--c",i.color);
  var ic=el("div","ic",i.icon);b.appendChild(ic);
  b.appendChild(el("div","nm",i.name));
  b.appendChild(el("div","st",i.got?"Zdobyta "+(i.date||""):"Do zdobycia"));
  b.onclick=function(){openDet(i.id)};g.appendChild(b)});
}
function openDet(id){
 var i=items.filter(function(x){return x.id==id})[0];if(!i)return;
 var d=$("det");d.innerHTML="";
 var ic=el("div","ic",i.icon);ic.style.setProperty("--c",i.color);if(!i.got){ic.style.filter="grayscale(1)";ic.style.opacity=".5"}
 d.appendChild(ic);d.appendChild(el("h2",null,i.name));
 d.appendChild(el("div","sub",i.desc||"Brak opisu"));
 d.appendChild(el("div","sub",i.got?"Zdobyta "+(i.date||""):"Jeszcze niezdobyta"));
 var r=el("div","row");
 var t=el("button","btn p",i.got?"Odbierz":"Przyznaj");
 t.onclick=function(){i.got=!i.got;i.date=i.got?today():"";save();render();close("ovDet")};
 var del=el("button","btn d","Usuń");
 del.onclick=function(){if(confirm("Usunąć sprawność „"+i.name+"”?")){items=items.filter(function(x){return x.id!=id});save();render();close("ovDet")}};
 r.appendChild(t);r.appendChild(del);d.appendChild(r);
 var c=el("div","row");var cb=el("button","btn","Zamknij");cb.onclick=function(){close("ovDet")};c.appendChild(cb);d.appendChild(c);
 $("ovDet").classList.add("show");
}
function close(id){$(id).classList.remove("show")}
function pick(box,cls,val,fn){[].forEach.call(box.children,function(c){c.classList.toggle("on",c.dataset.v==val)});fn&&fn()}
function buildAdd(){
 var t=$("tpl");t.innerHTML="";
 TPL.forEach(function(x,n){var c=el("button","chip",x[1]+" "+x[0]);c.dataset.v=n;c.onclick=function(){
  $("fn").value=x[0];$("fd").value=x[2];sel.icon=x[1];pick($("icons"),"",x[1]);
  [].forEach.call(t.children,function(k){k.classList.toggle("on",k==c)})};t.appendChild(c)});
 var ic=$("icons");ic.innerHTML="";
 ICONS.forEach(function(x){var c=el("button","chip",x);c.dataset.v=x;c.onclick=function(){sel.icon=x;pick(ic,"",x)};ic.appendChild(c)});
 var co=$("cols");co.innerHTML="";
 COLORS.forEach(function(x){var c=el("button","col");c.style.setProperty("--c",x);c.dataset.v=x;c.onclick=function(){sel.color=x;pick(co,"",x)};co.appendChild(c)});
 $("fn").value="";$("fd").value="";$("fg").checked=false;sel={icon:"🏅",color:COLORS[0]};
 pick(ic,"","🏅");pick(co,"",COLORS[0]);
}
$("fab").onclick=function(){buildAdd();$("ovAdd").classList.add("show")};
$("cancel").onclick=function(){close("ovAdd")};
$("save").onclick=function(){
 var n=$("fn").value.trim();if(!n){$("fn").focus();return}
 var g=$("fg").checked;
 items.push({id:Date.now(),name:n,desc:$("fd").value.trim(),icon:sel.icon,color:sel.color,got:g,date:g?today():""});
 save();render();close("ovAdd");
};
[].forEach.call(document.querySelectorAll(".ov"),function(o){o.onclick=function(e){if(e.target==o)o.classList.remove("show")}});
$("tabs").onclick=function(e){var f=e.target.dataset&&e.target.dataset.f;if(!f)return;filter=f;
 [].forEach.call($("tabs").children,function(b){b.classList.toggle("on",b==e.target)});render()};
load();render();
</script>
</body>
</html>
